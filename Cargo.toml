[package]
name = "iqawx-lab"
version = "4.1.0"
edition = "2021"
rust-version = "1.93"
description = "Rust network inspection, encoding analysis and keyed decryption toolkit"

[[bin]]
name = "iqawx_lab"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
data-encoding = "2"
hex = "0.4"
sha2 = { version = "0.10", features = ["oid"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
chacha20poly1305 = "0.10"
rsa = { version = "0.9", features = ["pem"] }
zeroize = "1"
ipnet = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
